<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Fuel Price Finder</title>

    <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <script
            src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }

        #search {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        #stations {
            margin-bottom: 20px;
        }

        .station-card {
            background: white;
            padding: 15px 20px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .station-card h3 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        .station-card.selected {
            background: #f0f7ff;
            border: 2px solid #4285f4;
        }

        .station-price {
            font-size: 24px;
            font-weight: bold;
        }

        .cheapest {
            border: 2px solid green;
        }

        #map {
            height: 500px;
            width: 100%;
            border-radius: 8px;
        }

        #search label {
            display: inline-block;
            margin: 8px 5px 8px 0;
        }

        #search input,
        #search select,
        #search button {
            padding: 8px 10px;
            margin: 5px;
            font-size: 16px;
        }

        #postalCode {
            width: 100px;
        }

        #searchButton {
            cursor: pointer;
        }

        #locationButton {
            cursor: pointer;
        }

        .location-row,
        .search-options {
            display: flex;
            align-items: end;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-options {
            margin-top: 15px;
        }

        .search-field {
            display: flex;
            flex-direction: column;
        }

        .search-field label {
            margin-bottom: 4px;
        }

        .or-text {
            align-self: center;
        }

        #searchButton {
            align-self: end;
        }

        .status-open {
            font-weight: bold;
            color: #198754;
        }

        .status-closed {
            font-weight: bold;
            color: #dc3545;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .location-row,
            .search-options {
                flex-direction: column;
                align-items: stretch;
            }

            .or-text {
                align-self: center;
            }

            #searchButton {
                align-self: stretch;
            }

            #search input,
            #search select,
            #search button {
                box-sizing: border-box;
                width: 100%;
                margin: 5px 0 10px 0;
            }

            #postalCode {
                width: 100%;
            }

            #map {
                height: 400px;
            }

            .station-price {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<h1>Fuel Price Finder</h1>

<p>Günstige Tankstellen in deiner Umgebung</p>

<div id="search">

    <h3>Tankstellen suchen</h3>

    <div class="location-row">
        <div class="search-field">
            <label for="postalCode">PLZ</label>
            <input
                    type="text"
                    id="postalCode"
                    placeholder="z. B. 86415"
                    maxlength="5"
            >
        </div>

        <span class="or-text">oder</span>

        <button id="locationButton">
            Meinen Standort verwenden
        </button>
    </div>

    <p id="locationStatus"></p>

    <div class="search-options">

        <div class="search-field">
            <label for="fuel">Kraftstoff</label>
            <select id="fuel">
                <option value="e10">E10</option>
                <option value="e5">E5</option>
                <option value="diesel">Diesel</option>
            </select>
        </div>

        <div class="search-field">
            <label for="radius">Radius</label>
            <select id="radius">
                <option value="2">2 km</option>
                <option value="5" selected>5 km</option>
                <option value="10">10 km</option>
                <option value="20">20 km</option>
            </select>
        </div>

        <div class="search-field">
            <label for="sort">Sortieren nach</label>
            <select id="sort">
                <option value="price" selected>Preis</option>
                <option value="distance">Entfernung</option>
            </select>
        </div>

        <button id="searchButton">
            Tankstellen suchen
        </button>

    </div>

</div>
<div id="stations">
    Tankstellen werden geladen...
</div>

<div id="map"></div>

<script type="module" src="app.js"></script>

</body>
</html>
